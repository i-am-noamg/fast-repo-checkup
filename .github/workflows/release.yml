name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must match Cargo.toml, e.g. 0.1.0)
        required: true
        type: string
      dry_run:
        description: Validate and build only; skip tag, GitHub Release, and crates.io
        required: true
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    outputs:
      sha: ${{ steps.resolve-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release input
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$VERSION"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid semver version: $version" >&2
            exit 1
          fi

          manifest_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)"
          if [[ -z "$manifest_version" ]]; then
            echo "Could not read package version from Cargo.toml" >&2
            exit 1
          fi

          if [[ "$version" != "$manifest_version" ]]; then
            echo "workflow_dispatch version ($version) must match Cargo.toml ($manifest_version)" >&2
            exit 1
          fi

      - name: Check for existing tag
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$VERSION"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Remote tag v$version already exists" >&2
            exit 1
          fi

      - name: Check for existing GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$VERSION"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release v$version already exists" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: false
          save-if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Cargo test
        run: cargo test --locked

      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # Node 24-compatible master revision
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87 # v2
        with:
          command: check all

      - id: resolve-sha
        name: Resolve release SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_suffix: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_suffix: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_suffix: zip
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: false
          save-if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

      - name: Cargo build
        run: cargo build --release --locked

      - name: Package release archive (Unix)
        if: matrix.os != 'windows-latest'
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_SUFFIX: ${{ matrix.archive_suffix }}
        shell: bash
        run: |
          set -euo pipefail
          version="$VERSION"
          archive="fast-repo-checkup-v${version}-${TARGET}.${ARCHIVE_SUFFIX}"
          tar -czf "$archive" \
            -C target/release fast-repo-checkup \
            -C "$GITHUB_WORKSPACE" README.md LICENSE-MIT LICENSE-APACHE
          echo "archive=$archive" >> "$GITHUB_ENV"

      - name: Package release archive (Windows)
        if: matrix.os == 'windows-latest'
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_SUFFIX: ${{ matrix.archive_suffix }}
        shell: pwsh
        run: |
          $archive = "fast-repo-checkup-v$env:VERSION-$env:TARGET.$env:ARCHIVE_SUFFIX"
          Compress-Archive `
            -Path target/release/fast-repo-checkup.exe, README.md, LICENSE-MIT, LICENSE-APACHE `
            -DestinationPath $archive
          "archive=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run && github.repository == 'i-am-noamg/fast-repo-checkup' && github.ref == 'refs/heads/main' }}
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum fast-repo-checkup-v* > SHA256SUMS
          cat > RELEASE_NOTES.md <<EOF
          Release commit: ${{ needs.validate.outputs.sha }}

          Install:
          - macOS/Linux: download the matching archive, extract it, and place \`fast-repo-checkup\` on your PATH.
          - Windows: download the matching archive, extract it, and place \`fast-repo-checkup.exe\` on your PATH.
          - Cargo: \`cargo install fast-repo-checkup --locked\`
          EOF

      - name: Create annotated tag
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" "$RELEASE_SHA" -m "Release v${VERSION}"
          git push origin "refs/tags/v${VERSION}"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ needs.validate.outputs.sha }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/fast-repo-checkup-v*
            dist/SHA256SUMS

  publish-crates:
    needs: [validate, build]
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run && github.repository == 'i-am-noamg/fast-repo-checkup' && github.ref == 'refs/heads/main' }}
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - name: Cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
